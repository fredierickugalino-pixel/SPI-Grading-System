<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | St. Peregrine Institute</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <main class="auth-card">

        <img src="logo.png" alt="St. Peregrine Institute Logo" class="school-logo">

        <h1>ST. PEREGRINE INSTITUTE</h1>
        <p class="subtitle">Online Grading System</p>

        <form method="POST" action="login.php">

            <label for="login_id">LRN or Email Address</label>
            <input
                type="text"
                id="login_id"
                name="login_id"
                placeholder="Enter your LRN or email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <div class="password-wrap">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    data-target="password"
                >Show</button>
            </div>

            <div class="login-options">
                <label class="remember-option">
                    <input
                        type="checkbox"
                        name="remember"
                        value="1">
                    <span>Remember me</span>
                </label>

                <a href="forgot_password.php" class="forgot-link">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="submit-button">
                LOGIN
            </button>

        </form>

        <p class="auth-switch">
            New student?
            <a href="register.html">Register here</a>
        </p>

    </main>
    <script src="script.js"></script>

</body>
</html>
